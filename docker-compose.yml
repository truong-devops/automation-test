name: automation-test

services:
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  orders:
    build:
      context: ./orders
    environment:
      HTTP_ADDRESS: ":8080"
      GRPC_ADDRESS: ":9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "orders_db"
      PAYMENTS_GRPC_ADDRESS: "payments:9090"
    ports:
      - "${ORDERS_HTTP_PORT:-8081}:8080"
      - "${ORDERS_GRPC_PORT:-9091}:9090"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  payments:
    build:
      context: ./payments
    environment:
      HTTP_ADDRESS: ":8080"
      GRPC_ADDRESS: ":9090"
      MONGO_URI: "mongodb://mongo:27017"
      MONGO_DATABASE: "payments_db"
      ORDERS_GRPC_ADDRESS: "orders:9090"
    ports:
      - "${PAYMENTS_HTTP_PORT:-8082}:8080"
      - "${PAYMENTS_GRPC_PORT:-9092}:9090"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

volumes:
  mongo_data:
